name: Build & Push zk-front to GHCR

# 트리거:
#  · main 푸시     → 배포 가능한 최신 이미지 (latest + git sha 태그)
#  · dev 푸시      → 테스트용 이미지 (dev + git sha 태그). latest 는 건드리지 않는다
#  · 수동 실행     → 재빌드가 필요할 때 GitHub Actions 화면에서 바로 실행
#
# 모노레포라서 zk-front/ 가 바뀐 푸시에만 돈다.
on:
  push:
    branches: [main, dev]
    paths:
      - "zk-front/**"
      - ".github/workflows/build-front.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # → ghcr.io/<owner>/zzikko-front
  IMAGE_NAME: ${{ github.repository }}-front

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # zk-front/Dockerfile 은 빌드 컨텍스트의 .env 를 next build 가 읽어 NEXT_PUBLIC_* 를
      # 번들에 박는 구조다. .env 는 git 에 없으므로 CI 에서 Repo Variables 로 만들어 준다.
      # (Dockerfile 을 ARG 방식으로 바꾸지 않은 이유: 로컬 docker compose --build 가
      #  기존처럼 zk-front/.env 를 그대로 쓰도록 유지하기 위함)
      #
      # ⚠️ NEXT_PUBLIC_* 는 브라우저에 노출되는 공개값만. 비공개 값은 절대 여기에 넣지 말 것.
      - name: Write zk-front/.env from repo variables
        run: |
          cat > zk-front/.env <<EOF
          NEXT_PUBLIC_BACK_API=${{ vars.NEXT_PUBLIC_BACK_API }}
          NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_NAVER_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_NAVER_SITE_VERIFICATION }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          EOF
          # 필수값이 비어 있으면 잘못된 API 주소가 박힌 이미지가 나가므로 빌드 중단
          if [ -z "${{ vars.NEXT_PUBLIC_BACK_API }}" ] || [ -z "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "::error::Repo Variables NEXT_PUBLIC_BACK_API / NEXT_PUBLIC_SITE_URL 가 비어 있습니다 (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./zk-front
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=zk-front
          cache-to: type=gha,mode=max,scope=zk-front
