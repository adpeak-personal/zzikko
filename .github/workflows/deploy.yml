# main 에 올라가면 검사 → 이미지 빌드(GHCR) → 서버(141.164.60.58:/opt/zzikko) 교체까지 자동으로 한다.
# Actions 화면의 Run workflow 버튼으로도 돌릴 수 있다.
#
# 저장소 시크릿 (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST      141.164.60.58
#   DEPLOY_USER      root
#   DEPLOY_SSH_KEY   그 계정으로 접속되는 개인키 전문
# 없으면 이미지만 올리고 서버 교체는 건너뛴다. GHCR 로그인은 GITHUB_TOKEN 으로 된다.

name: deploy

on:
  push:
    branches: [main]
    # 문서만 고친 커밋으로 운영 컨테이너를 다시 띄울 이유는 없다
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BACK_IMAGE: ghcr.io/${{ github.repository_owner }}/zzikko-back
  FRONT_IMAGE: ghcr.io/${{ github.repository_owner }}/zzikko-front

jobs:
  # 깨진 코드를 이미지로 만들지 않는다
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 백엔드 타입 검사
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit
      - name: 프론트 타입 검사
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 백엔드 이미지
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACK_IMAGE }}:latest
            ${{ env.BACK_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back

      - name: 프론트 이미지
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # rewrites(/api, /uploads → 백엔드)가 빌드 때 박힌다 — compose 의 백엔드 서비스 이름
          build-args: |
            API_URL=http://back:4080
          tags: |
            ${{ env.FRONT_IMAGE }}:latest
            ${{ env.FRONT_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 시크릿 확인
        id: secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEPLOY_HOST / DEPLOY_SSH_KEY 가 없어 서버 교체를 건너뜁니다 (이미지는 GHCR 에 올라갔습니다)"
          fi

      - name: SSH 준비
        if: steps.secrets.outputs.ok == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config

      - name: 서버에서 이미지 교체
        if: steps.secrets.outputs.ok == 'true'
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$TARGET" "mkdir -p /opt/zzikko"
          scp deploy/docker-compose.yml deploy/deploy.sh "$TARGET:/opt/zzikko/"
          ssh "$TARGET" "ZZIKKO_TAG='sha-${{ github.sha }}' bash /opt/zzikko/deploy.sh"
